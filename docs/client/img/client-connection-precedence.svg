<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Client connection options precedence</title>
  <desc id="desc">Connection options are built in layers: SDK defaults, then a profile from the TOML config file, then TEMPORAL_ environment variables, then changes made in code. Each layer overrides the previous one, and the result is passed to client.Dial.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827;white-space:pre}
      .n{font-size:12px;font-weight:700;fill:#ffffff}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">Where connection options come from (later layers win)</text>
  <rect x="20" y="80" width="170" height="150" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t bb" x="105" y="108" text-anchor="middle">1. SDK defaults</text>
  <text class="m" x="105" y="140" text-anchor="middle">127.0.0.1:7233</text>
  <text class="m" x="105" y="162" text-anchor="middle">Namespace default</text>
  <text class="m" x="105" y="184" text-anchor="middle">no TLS</text>
  <line x1="190" y1="155" x2="206" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="210" y="80" width="170" height="150" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="295" y="108" text-anchor="middle">2. TOML profile</text>
  <text class="m" x="295" y="140" text-anchor="middle">~/.config/temporalio/</text>
  <text class="m" x="295" y="162" text-anchor="middle">temporal.toml</text>
  <text class="t s" x="295" y="184" text-anchor="middle">TEMPORAL_PROFILE</text>
  <line x1="380" y1="155" x2="396" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="400" y="80" width="170" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="485" y="108" text-anchor="middle">3. Env variables</text>
  <text class="m" x="485" y="140" text-anchor="middle">TEMPORAL_ADDRESS</text>
  <text class="m" x="485" y="162" text-anchor="middle">TEMPORAL_NAMESPACE</text>
  <text class="m" x="485" y="184" text-anchor="middle">TEMPORAL_API_KEY …</text>
  <line x1="570" y1="155" x2="586" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="590" y="80" width="170" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="675" y="108" text-anchor="middle">4. Your code</text>
  <text class="m" x="675" y="140" text-anchor="middle">opts.Identity = …</text>
  <text class="m" x="675" y="162" text-anchor="middle">opts.Logger = …</text>
  <text class="m" x="675" y="184" text-anchor="middle">opts.HostPort = …</text>
  <line x1="780" y1="155" x2="806" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="810" y="100" width="130" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="m" x="875" y="140" text-anchor="middle">client.Options</text>
  <text class="t bb" x="875" y="170" text-anchor="middle">↓</text>
  <text class="m" x="875" y="194" text-anchor="middle">client.Dial</text>
  <rect x="20" y="260" width="920" height="110" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t bb" x="36" y="288">In Go</text>
  <text class="m" x="36" y="314">opts, err := envconfig.LoadClientOptions(envconfig.LoadClientOptionsRequest{})  // layers 1–3</text>
  <text class="m" x="36" y="336">opts.Identity = "checkout@" + host                                               // layer 4</text>
  <text class="m" x="36" y="358">c, err := client.Dial(opts)</text>
</svg>
