<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Starting a Workflow Execution</title>
  <desc id="desc">ExecuteWorkflow sends the Workflow Type, arguments, Task Queue and options to the Service, which writes WorkflowExecutionStarted and WorkflowTaskScheduled and puts a Workflow Task on the Task Queue. ExecuteWorkflow returns a WorkflowRun handle right away. Later, a Worker polling the same Task Queue picks up the Task and runs the code.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827;white-space:pre}
      .n{font-size:12px;font-weight:700;fill:#ffffff}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">ExecuteWorkflow returns as soon as the start is recorded</text>
  <rect x="20" y="80" width="270" height="230" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="36" y="106">Your process</text>
  <text class="m" x="36" y="134">c.ExecuteWorkflow(ctx,</text>
  <text class="m" x="36" y="152">  client.StartWorkflowOptions{</text>
  <text class="m" x="36" y="170">    ID: "trial-ACC-5521",</text>
  <text class="m" x="36" y="188">    TaskQueue: "subscriptions",</text>
  <text class="m" x="36" y="206">  },</text>
  <text class="m" x="36" y="224">  StartTrialWorkflow, in)</text>
  <rect x="36" y="246" width="238" height="50" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="m" x="48" y="266">← client.WorkflowRun</text>
  <text class="t s" x="48" y="284">GetID · GetRunID · Get</text>
  <rect x="360" y="70" width="330" height="250" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t bb" x="525" y="96" text-anchor="middle">Temporal Service</text>
  <rect x="376" y="110" width="298" height="92" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t bb" x="390" y="132">Event History of trial-ACC-5521</text>
  <text class="m" x="390" y="156">1 WorkflowExecutionStarted</text>
  <text class="m" x="390" y="176">2 WorkflowTaskScheduled</text>
  <rect x="376" y="220" width="298" height="84" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t bb" x="390" y="242">Task Queue “subscriptions”</text>
  <rect x="390" y="256" width="64" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="422" y="278" text-anchor="middle">WT</text>
  <text class="t s" x="466" y="278">waits for a Worker</text>
  <circle cx="325" cy="140" r="11" fill="#374151"/>
  <text class="t n" x="325" y="144" text-anchor="middle">1</text>
  <line x1="290" y1="160" x2="372" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text class="t s" x="331" y="182" text-anchor="middle">start</text>
  <circle cx="325" cy="250" r="11" fill="#374151"/>
  <text class="t n" x="325" y="254" text-anchor="middle">2</text>
  <line x1="372" y1="270" x2="294" y2="270" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text class="t s" x="333" y="292" text-anchor="middle">handle</text>
  <rect x="760" y="200" width="180" height="90" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="774" y="224">Worker (later)</text>
  <text class="t s" x="774" y="244">polls “subscriptions”,</text>
  <text class="t s" x="774" y="261">runs the Workflow</text>
  <line x1="756" y1="260" x2="678" y2="270" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
  <circle cx="717" cy="240" r="11" fill="#374151"/>
  <text class="t n" x="717" y="244" text-anchor="middle">3</text>
  <rect x="20" y="340" width="920" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t b" x="36" y="366">Required: TaskQueue (no default). Strongly recommended: ID = business key (default: random UUID).</text>
  <text class="t s" x="36" y="390">Wrong Task Queue or unregistered Type: the start still succeeds, and the Workflow never runs or keeps failing.</text>
  <text class="t s" x="36" y="408">The ctx only bounds the start request. Cancelling it later doesn't cancel the Workflow.</text>
</svg>
