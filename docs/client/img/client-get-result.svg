<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="title desc">
  <title id="title">Reading a Workflow result</title>
  <desc id="desc">run.Get blocks until the Workflow closes. Completed fills the result. Failed, canceled, terminated and timed-out Workflows return a WorkflowExecutionError whose cause is an ApplicationError, CanceledError, TerminatedError or TimeoutError. A run that continued as new is followed to the next run. If the caller's context expires first, Get returns a gRPC DeadlineExceeded error and the Workflow keeps running.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827;white-space:pre}
      .n{font-size:12px;font-weight:700;fill:#ffffff}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="530" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">What run.Get(ctx, &amp;out) gives you</text>
  <rect x="20" y="190" width="250" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="34" y="214">run.Get(ctx, &amp;out)</text>
  <text class="m" x="34" y="234">GetWithOptions(…)</text>
  <text class="t s" x="34" y="251">blocks until the Workflow</text>
  <text class="t s" x="34" y="268">closes or ctx expires</text>
  <rect x="330" y="66" width="230" height="46" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="344" y="94">Completed</text>
  <text class="t s" x="576" y="94">out is filled, err == nil</text>
  <line x1="270" y1="245" x2="326" y2="89" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="330" y="126" width="230" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t bb" x="344" y="154">Failed</text>
  <text class="t s" x="576" y="154">WorkflowExecutionError → *temporal.ApplicationError</text>
  <line x1="270" y1="245" x2="326" y2="149" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="330" y="186" width="230" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="344" y="214">Canceled</text>
  <text class="t s" x="576" y="214">WorkflowExecutionError → *temporal.CanceledError</text>
  <line x1="270" y1="245" x2="326" y2="209" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="330" y="246" width="230" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="344" y="274">Terminated</text>
  <text class="t s" x="576" y="274">WorkflowExecutionError → *temporal.TerminatedError</text>
  <line x1="270" y1="245" x2="326" y2="269" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="330" y="306" width="230" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="344" y="334">Timed out</text>
  <text class="t s" x="576" y="334">WorkflowExecutionError → *temporal.TimeoutError</text>
  <line x1="270" y1="245" x2="326" y2="329" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="330" y="366" width="230" height="46" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t bb" x="344" y="394">Continued as new / retried / cron</text>
  <text class="t s" x="576" y="394">followed to the next run (unless DisableFollowingRuns)</text>
  <line x1="270" y1="245" x2="326" y2="389" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="330" y="426" width="230" height="46" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t bb" x="344" y="454">ctx expired first</text>
  <text class="t s" x="576" y="454">*serviceerror.DeadlineExceeded. Workflow keeps running</text>
  <line x1="270" y1="245" x2="326" y2="449" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 326 389 C 230 389, 150 370, 150 304" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrp)"/>
  <text class="t s" x="30" y="512">Dashed: Get follows the chain, and run.GetRunID() moves to the latest run.</text>
</svg>
