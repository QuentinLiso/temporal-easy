<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Activity Operations on the Activity state machine</title>
  <desc id="desc">States of an Activity Execution (Scheduled, Running, Paused, Closed, Deleted) and how Pause, Unpause, Reset, Update Options, Request Cancel, Terminate and Delete move it between them.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#111827}
      .op{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:700}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">What each operator command does to an Activity Execution</text>

  <!-- Open region -->
  <rect x="24" y="56" width="584" height="330" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text class="t b" x="40" y="78" style="font-weight:700;fill:#4b5563">OPEN</text>

  <!-- SCHEDULED -->
  <rect x="50" y="110" width="190" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t h" x="145" y="138" text-anchor="middle">SCHEDULED</text>
  <text class="t s" x="145" y="158" text-anchor="middle">in queue or in retry backoff</text>

  <!-- RUNNING -->
  <rect x="400" y="110" width="190" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t h" x="495" y="138" text-anchor="middle">RUNNING</text>
  <text class="t s" x="495" y="158" text-anchor="middle">an attempt is in progress</text>

  <!-- S <-> R -->
  <line x1="240" y1="128" x2="396" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t s" x="318" y="120" text-anchor="middle">Worker picks up attempt</text>
  <line x1="400" y1="164" x2="244" y2="164" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t s" x="318" y="182" text-anchor="middle">attempt failed → backoff</text>

  <!-- PAUSED -->
  <rect x="225" y="290" width="190" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t h" x="320" y="318" text-anchor="middle">PAUSED</text>
  <text class="t s" x="320" y="338" text-anchor="middle">no new attempt scheduled</text>

  <!-- Pause from S -->
  <line x1="150" y1="180" x2="250" y2="286" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text class="op" x="150" y="240" style="fill:#1d4ed8">Pause</text>
  <!-- Pause from R -->
  <line x1="480" y1="180" x2="390" y2="286" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text class="op" x="446" y="236" style="fill:#1d4ed8">Pause</text>
  <text class="t s" x="446" y="252">delivered on next heartbeat;</text>
  <text class="t s" x="446" y="266">no heartbeat → after the attempt</text>
  <!-- Unpause -->
  <path d="M225 330 C 80 330, 70 250, 100 184" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text class="op" x="40" y="300" style="fill:#1d4ed8">Unpause</text>
  <text class="t s" x="40" y="316">dispatch now,</text>
  <text class="t s" x="40" y="330">attempt # kept</text>

  <!-- Reset loop on SCHEDULED -->
  <path d="M90 110 C 90 80, 200 80, 200 106" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrB)"/>
  <text class="op" x="214" y="92" style="fill:#1d4ed8">Reset</text>
  <text class="t s" x="258" y="92">attempt=1, backoff dropped, also unpauses (unless --keep-paused)</text>

  <!-- Update options note -->
  <rect x="440" y="300" width="166" height="74" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text class="op" x="452" y="320" style="fill:#1d4ed8">UpdateOptions</text>
  <text class="t s" x="452" y="338">scheduled → now</text>
  <text class="t s" x="452" y="352">running → next attempt</text>
  <text class="t s" x="452" y="366">paused → on unpause</text>

  <!-- CLOSED -->
  <rect x="720" y="96" width="215" height="150" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text class="t h" x="827" y="124" text-anchor="middle">CLOSED</text>
  <text class="t s" x="827" y="148" text-anchor="middle">Completed · Failed · TimedOut</text>
  <text class="t s" x="827" y="166" text-anchor="middle">Canceled · Terminated</text>
  <text class="t s" x="827" y="194" text-anchor="middle">kept for the Namespace</text>
  <text class="t s" x="827" y="210" text-anchor="middle">Retention Period, then gone</text>
  <text class="t s" x="827" y="232" text-anchor="middle">ops on a closed Activity → error</text>

  <line x1="590" y1="128" x2="716" y2="128" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t s" x="664" y="120" text-anchor="middle">result / error</text>

  <!-- Cancel & Terminate from OPEN region -->
  <path d="M608 220 L 716 220" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text class="op" x="616" y="212" style="fill:#b91c1c">Cancel</text>
  <path d="M608 300 C 680 300, 760 290, 790 250" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text class="op" x="626" y="322" style="fill:#b91c1c">Terminate</text>
  <text class="t s" x="626" y="338">Standalone only · forceful,</text>
  <text class="t s" x="626" y="352">no cleanup, can't be declined</text>

  <!-- DELETED -->
  <rect x="735" y="400" width="195" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t h" x="832" y="424" text-anchor="middle">DELETED</text>
  <text class="t s" x="832" y="442" text-anchor="middle">record removed, ID free</text>
  <line x1="832" y1="246" x2="832" y2="396" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
  <text class="op" x="842" y="300" style="fill:#b91c1c">Delete</text>
  <text class="t s" x="842" y="316">Standalone only</text>
  <text class="t s" x="842" y="330">async; terminates</text>
  <text class="t s" x="842" y="344">first if running</text>

  <!-- footer -->
  <rect x="24" y="410" width="690" height="170" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text class="t b" x="40" y="434" style="font-weight:700">How to read it</text>
  <text class="t s" x="40" y="456">• Cancel = Request Cancel. No attempt running → closes immediately. Attempt running → arrives on the next heartbeat;</text>
  <text class="t s" x="52" y="472">the code may still complete. Workflow Activities are cancelled through their Workflow, not directly.</text>
  <text class="t s" x="40" y="494">• Pause / Reset / Cancel reach a RUNNING attempt only through RecordHeartbeat. Terminate and Delete don't need it.</text>
  <text class="t s" x="40" y="516">• Precedence when they collide: Request Cancel  &gt;  Reset  &gt;  Pause.</text>
  <text class="t s" x="40" y="538">• Schedule-To-Close keeps ticking while PAUSED and is not restarted by Reset → extend it with UpdateOptions.</text>
  <text class="t s" x="40" y="560">• None of these write Workflow Event History — check state with describe or the UI.</text>
</svg>
