<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Standalone Activity ID policies</title>
  <desc id="desc">Decision flow when starting a Standalone Activity with an Activity ID that is already used: the Conflict Policy handles a running execution, the Reuse Policy handles a closed execution still within retention.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#111827}
      .ok{fill:#047857;font-weight:700}
      .ko{fill:#b91c1c;font-weight:700}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">client.ExecuteActivity with ID "export-cust-4821" — what happens?</text>

  <!-- Q1 -->
  <rect x="330" y="56" width="300" height="56" rx="28" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t b" x="480" y="80" text-anchor="middle" style="font-weight:700">Is an execution with this ID</text>
  <text class="t b" x="480" y="98" text-anchor="middle" style="font-weight:700">currently RUNNING?</text>

  <!-- yes branch -->
  <path d="M330 84 L 230 84 L 230 140" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="280" y="76" text-anchor="middle">yes</text>
  <rect x="40" y="142" width="380" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t b" x="230" y="160" text-anchor="middle" style="font-weight:700">ActivityIDConflictPolicy</text>
  <text class="m" x="230" y="175" text-anchor="middle">enums.ACTIVITY_ID_CONFLICT_POLICY_*</text>

  <rect x="40" y="198" width="180" height="92" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t b" x="130" y="220" text-anchor="middle" style="font-weight:700">FAIL (default)</text>
  <text class="t s" x="130" y="242" text-anchor="middle">no new execution</text>
  <text class="t s" x="130" y="260" text-anchor="middle">returns an</text>
  <text class="t s" x="130" y="278" text-anchor="middle">AlreadyStarted error</text>
  <rect x="240" y="198" width="180" height="92" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="t b" x="330" y="220" text-anchor="middle" style="font-weight:700">USE_EXISTING</text>
  <text class="t s" x="330" y="242" text-anchor="middle">no new execution</text>
  <text class="t s" x="330" y="260" text-anchor="middle">returns a handle to</text>
  <text class="t s" x="330" y="278" text-anchor="middle">the running one</text>

  <!-- no branch -->
  <path d="M630 84 L 730 84 L 730 140" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="680" y="76" text-anchor="middle">no</text>
  <rect x="540" y="142" width="380" height="56" rx="28" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t b" x="730" y="166" text-anchor="middle" style="font-weight:700">Is a CLOSED execution with this ID</text>
  <text class="t b" x="730" y="184" text-anchor="middle" style="font-weight:700">still retained in the Namespace?</text>

  <path d="M540 170 L 455 170 L 455 434 L 468 434" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="462" y="160">no</text>

  <line x1="730" y1="198" x2="730" y2="226" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="742" y="216">yes</text>
  <rect x="540" y="228" width="380" height="40" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text class="t b" x="730" y="246" text-anchor="middle" style="font-weight:700">ActivityIDReusePolicy</text>
  <text class="m" x="730" y="261" text-anchor="middle">enums.ACTIVITY_ID_REUSE_POLICY_*</text>

  <rect x="470" y="284" width="140" height="120" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="t b" x="540" y="304" text-anchor="middle" style="font-weight:700">ALLOW_DUPLICATE</text>
  <text class="t s" x="540" y="322" text-anchor="middle">(default)</text>
  <text class="t s" x="540" y="346" text-anchor="middle">always starts</text>
  <text class="t s" x="540" y="364" text-anchor="middle">a new execution</text>

  <rect x="620" y="284" width="160" height="120" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="t b" x="700" y="304" text-anchor="middle" style="font-weight:700">ALLOW_DUPLICATE_</text>
  <text class="t b" x="700" y="320" text-anchor="middle" style="font-weight:700">FAILED_ONLY</text>
  <text class="t s" x="700" y="344" text-anchor="middle">starts only if previous</text>
  <text class="t s" x="700" y="362" text-anchor="middle">failed, was canceled,</text>
  <text class="t s" x="700" y="380" text-anchor="middle">terminated or timed out</text>

  <rect x="790" y="284" width="130" height="120" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t b" x="855" y="304" text-anchor="middle" style="font-weight:700">REJECT_</text>
  <text class="t b" x="855" y="320" text-anchor="middle" style="font-weight:700">DUPLICATE</text>
  <text class="t s" x="855" y="344" text-anchor="middle">never starts;</text>
  <text class="t s" x="855" y="362" text-anchor="middle">returns already-</text>
  <text class="t s" x="855" y="380" text-anchor="middle">started error</text>

  <!-- Footer notes -->
  <rect x="40" y="310" width="400" height="136" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text class="t b" x="56" y="334" style="font-weight:700">Remember</text>
  <text class="t s" x="56" y="356">• Two executions never run with the same ID at once.</text>
  <text class="t s" x="56" y="376">• Standalone IDs live in their own ID space (not Workflow IDs).</text>
  <text class="t s" x="56" y="396">• Reuse checks reach back only as far as the Retention Period;</text>
  <text class="t s" x="66" y="414">Delete frees the ID earlier.</text>
  <text class="t s" x="56" y="434">• ID dedup ≠ idempotency — you need both.</text>

  <rect x="470" y="418" width="450" height="32" rx="16" fill="#d1fae5" stroke="#059669"/>
  <text class="t b" x="695" y="439" text-anchor="middle">never used, or older than retention → a new execution starts</text>
</svg>
