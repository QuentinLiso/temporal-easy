<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Cancelling a Workflow Activity</title>
  <desc id="desc">The Workflow requests cancellation, the Service records it, and the request only reaches the running Activity through its next heartbeat response; WaitForCancellation decides whether the Workflow waits for the Activity to acknowledge.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#111827}
      .ev{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#6d28d9}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">Cancellation travels on the heartbeat</text>

  <rect x="40" y="54" width="220" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="150" y="81" text-anchor="middle">Workflow</text>
  <rect x="370" y="54" width="220" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t h" x="480" y="81" text-anchor="middle">Temporal Service</text>
  <rect x="700" y="54" width="220" height="44" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="t h" x="810" y="81" text-anchor="middle">Activity Worker</text>
  <g stroke="#9ca3af" stroke-dasharray="4 4">
    <line x1="150" y1="98" x2="150" y2="540"/>
    <line x1="480" y1="98" x2="480" y2="540"/>
    <line x1="810" y1="98" x2="810" y2="540"/>
  </g>

  <!-- running activity bar -->
  <rect x="802" y="112" width="16" height="320" rx="3" fill="#a7f3d0"/>

  <!-- heartbeat before cancel -->
  <line x1="800" y1="130" x2="484" y2="130" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrG)"/>
  <text class="m" x="645" y="124" text-anchor="middle">RecordHeartbeat(ctx, progress)</text>
  <line x1="484" y1="146" x2="800" y2="146" stroke="#059669" stroke-width="1" stroke-dasharray="2 3" marker-end="url(#arrG)"/>
  <text class="t s" x="645" y="160" text-anchor="middle">ok, keep going</text>

  <!-- cancel -->
  <rect x="20" y="170" width="200" height="40" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text class="m" x="120" y="187" text-anchor="middle">cancelRefund()  or the</text>
  <text class="m" x="120" y="202" text-anchor="middle">Workflow is cancelled</text>
  <line x1="150" y1="220" x2="476" y2="220" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="315" y="213" text-anchor="middle">① RequestCancelActivityTask</text>
  <text class="ev" x="490" y="240">ActivityTaskCancelRequested</text>

  <!-- next heartbeat delivers cancel -->
  <line x1="800" y1="270" x2="484" y2="270" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrG)"/>
  <text class="m" x="645" y="264" text-anchor="middle">② next RecordHeartbeat(...)</text>
  <line x1="484" y1="290" x2="800" y2="290" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="645" y="306" text-anchor="middle" style="fill:#b91c1c">③ response: cancel requested → ctx.Done() closes</text>

  <rect x="690" y="318" width="250" height="62" rx="6" fill="#ffffff" stroke="#059669"/>
  <text class="t s" x="700" y="338">④ select on ctx.Done(): release locks,</text>
  <text class="t s" x="700" y="354">void the pending refund, then</text>
  <text class="m" x="700" y="371">return ctx.Err()</text>

  <line x1="800" y1="400" x2="484" y2="400" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="645" y="394" text-anchor="middle">⑤ RespondActivityTaskCanceled</text>
  <text class="ev" x="490" y="420">ActivityTaskCanceled</text>

  <!-- WaitForCancellation boxes -->
  <rect x="20" y="250" width="270" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text class="t b" x="32" y="270" style="font-weight:700">WaitForCancellation: false (default)</text>
  <text class="t s" x="32" y="290">future.Get returns CanceledError right</text>
  <text class="t s" x="32" y="306">after ①, cleanup still happens in background</text>

  <line x1="476" y1="450" x2="154" y2="450" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="315" y="443" text-anchor="middle">⑥ new Workflow Task</text>
  <rect x="20" y="462" width="270" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text class="t b" x="32" y="482" style="font-weight:700">WaitForCancellation: true</text>
  <text class="t s" x="32" y="502">future.Get returns only after ⑤ — the</text>
  <text class="t s" x="32" y="518">Workflow knows cleanup has finished</text>

  <rect x="560" y="462" width="380" height="70" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="t b" x="572" y="482" style="font-weight:700">No heartbeat = no cancellation delivered</text>
  <text class="t s" x="572" y="502">The attempt runs to the end (or Start-To-Close) and the</text>
  <text class="t s" x="572" y="518">request applies at the next attempt boundary.</text>
</svg>
