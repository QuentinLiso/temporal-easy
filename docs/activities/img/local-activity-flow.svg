<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Regular Activity path versus Local Activity path</title>
  <desc id="desc">A regular Activity goes through the Temporal Service and an Activity Task Queue; a Local Activity runs in an in-process queue inside the Workflow Worker and only a MarkerRecorded event is persisted when the Workflow Task completes.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#111827}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">Regular Activity vs Local Activity — where does the work travel?</text>

  <!-- Regular path -->
  <text class="t h" x="30" y="72" style="fill:#1d4ed8">Regular Activity  (workflow.ExecuteActivity)</text>
  <g>
    <rect x="30" y="86" width="150" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text class="t b" x="105" y="112" text-anchor="middle" style="font-weight:700">Workflow Worker</text>
    <text class="t s" x="105" y="130" text-anchor="middle">completes Workflow Task</text>
    <text class="m" x="105" y="146" text-anchor="middle">ScheduleActivityTask</text>

    <line x1="180" y1="121" x2="218" y2="121" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="220" y="86" width="150" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="t b" x="295" y="112" text-anchor="middle" style="font-weight:700">Temporal Service</text>
    <text class="t s" x="295" y="130" text-anchor="middle">writes Scheduled event</text>
    <text class="t s" x="295" y="146" text-anchor="middle">creates Activity Task</text>

    <line x1="370" y1="121" x2="408" y2="121" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="410" y="86" width="150" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="t b" x="485" y="112" text-anchor="middle" style="font-weight:700">Activity Task Queue</text>
    <text class="t s" x="485" y="130" text-anchor="middle">routing · rate limits</text>
    <text class="t s" x="485" y="146" text-anchor="middle">durable retries</text>

    <line x1="560" y1="121" x2="598" y2="121" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="600" y="86" width="150" height="70" rx="8" fill="#d1fae5" stroke="#059669"/>
    <text class="t b" x="675" y="112" text-anchor="middle" style="font-weight:700">Activity Worker</text>
    <text class="t s" x="675" y="130" text-anchor="middle">polls, runs, heartbeats</text>
    <text class="t s" x="675" y="146" text-anchor="middle">reports result</text>

    <line x1="750" y1="121" x2="788" y2="121" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="790" y="86" width="140" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text class="t b" x="860" y="112" text-anchor="middle" style="font-weight:700">New Workflow</text>
    <text class="t b" x="860" y="128" text-anchor="middle" style="font-weight:700">Task</text>
    <text class="t s" x="860" y="146" text-anchor="middle">Workflow resumes</text>
  </g>
  <text class="t s" x="30" y="182">Event History: ActivityTaskScheduled · ActivityTaskStarted · ActivityTaskCompleted  —  ≥ 2 round trips through the Service</text>

  <!-- Local path -->
  <text class="t h" x="30" y="232" style="fill:#6d28d9">Local Activity  (workflow.ExecuteLocalActivity)</text>
  <rect x="30" y="246" width="720" height="140" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="6 4"/>
  <text class="t b" x="46" y="268" style="font-weight:700;fill:#6d28d9">One Workflow Worker process, one Workflow Task</text>

  <rect x="50" y="284" width="150" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t b" x="125" y="310" text-anchor="middle" style="font-weight:700">Workflow code</text>
  <text class="t s" x="125" y="328" text-anchor="middle">schedules Local</text>
  <text class="t s" x="125" y="344" text-anchor="middle">Activity</text>

  <line x1="200" y1="324" x2="238" y2="324" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="240" y="284" width="150" height="80" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text class="t b" x="315" y="310" text-anchor="middle" style="font-weight:700">In-process queue</text>
  <text class="t s" x="315" y="328" text-anchor="middle">no Task Queue,</text>
  <text class="t s" x="315" y="344" text-anchor="middle">no Service hop</text>

  <line x1="390" y1="324" x2="428" y2="324" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="430" y="284" width="150" height="80" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="t b" x="505" y="310" text-anchor="middle" style="font-weight:700">Runs immediately</text>
  <text class="t s" x="505" y="328" text-anchor="middle">result handed straight</text>
  <text class="t s" x="505" y="344" text-anchor="middle">back to the Workflow</text>

  <line x1="580" y1="324" x2="618" y2="324" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="620" y="284" width="120" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t b" x="680" y="310" text-anchor="middle" style="font-weight:700">Workflow</text>
  <text class="t b" x="680" y="326" text-anchor="middle" style="font-weight:700">continues</text>
  <text class="t s" x="680" y="344" text-anchor="middle">same task</text>

  <line x1="750" y1="324" x2="788" y2="324" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="790" y="284" width="140" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t b" x="860" y="306" text-anchor="middle" style="font-weight:700">Temporal Service</text>
  <text class="t s" x="860" y="324" text-anchor="middle">on Workflow Task</text>
  <text class="t s" x="860" y="340" text-anchor="middle">completion only:</text>
  <text class="m" x="860" y="356" text-anchor="middle">MarkerRecorded</text>

  <!-- warning box -->
  <rect x="30" y="406" width="900" height="76" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text class="t b" x="46" y="428" style="font-weight:700">⚠ Durability gap</text>
  <text class="t s" x="46" y="448">Until MarkerRecorded is written, the result only lives in Worker memory. If the Worker crashes first, the Workflow Task is retried and the</text>
  <text class="t s" x="46" y="466">Local Activity runs again → at-least-once, must be idempotent. No Activity heartbeats, no Task Queue routing, Signals wait until it finishes.</text>
</svg>
