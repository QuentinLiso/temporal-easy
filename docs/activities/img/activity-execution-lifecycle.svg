<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Activity Execution lifecycle</title>
  <desc id="desc">Sequence between the Workflow Worker, the Temporal Service and the Activity Worker when a Workflow schedules an Activity, including a failed attempt that is retried.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#111827}
      .ev{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#6d28d9}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="680" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">Lifecycle of a Workflow Activity (one failed attempt, one retry)</text>

  <!-- Lane headers -->
  <rect x="40" y="56" width="220" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="150" y="85" text-anchor="middle">Workflow Worker</text>
  <rect x="370" y="56" width="220" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t h" x="480" y="78" text-anchor="middle">Temporal Service</text>
  <text class="t s" x="480" y="96" text-anchor="middle">Event History · Activity Task Queue</text>
  <rect x="700" y="56" width="220" height="48" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="t h" x="810" y="85" text-anchor="middle">Activity Worker</text>

  <!-- Lifelines -->
  <line x1="150" y1="104" x2="150" y2="650" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="480" y1="104" x2="480" y2="650" stroke="#9ca3af" stroke-dasharray="4 4"/>
  <line x1="810" y1="104" x2="810" y2="650" stroke="#9ca3af" stroke-dasharray="4 4"/>

  <!-- 1 schedule -->
  <text class="m" x="160" y="128">workflow.ExecuteActivity(...)</text>
  <line x1="150" y1="160" x2="476" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="315" y="153" text-anchor="middle">① ScheduleActivityTask command</text>
  <text class="ev" x="490" y="178">ActivityTaskScheduled</text>

  <!-- 2 poll -->
  <line x1="806" y1="212" x2="484" y2="212" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="645" y="206" text-anchor="middle">② Poll Activity Task Queue</text>
  <line x1="484" y1="238" x2="806" y2="238" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="645" y="232" text-anchor="middle">③ Activity Task (attempt 1)</text>

  <!-- 3 run & fail -->
  <rect x="770" y="252" width="80" height="50" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t b" x="810" y="274" text-anchor="middle">run</text>
  <text class="t b" x="810" y="292" text-anchor="middle">✕ error</text>
  <line x1="806" y1="316" x2="484" y2="316" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text class="t b" x="645" y="310" text-anchor="middle">④ RespondActivityTaskFailed</text>

  <!-- retry box -->
  <rect x="380" y="330" width="200" height="62" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="t b" x="480" y="352" text-anchor="middle">⑤ Retry Policy says retry</text>
  <text class="t s" x="480" y="370" text-anchor="middle">wait backoff (1s, 2s, 4s…)</text>
  <text class="t s" x="480" y="385" text-anchor="middle">nothing new in Event History</text>

  <!-- attempt 2 -->
  <line x1="484" y1="416" x2="806" y2="416" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="645" y="410" text-anchor="middle">⑥ Activity Task (attempt 2)</text>
  <rect x="770" y="430" width="80" height="50" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text class="t b" x="810" y="452" text-anchor="middle">run</text>
  <text class="t b" x="810" y="470" text-anchor="middle">✓ result</text>
  <line x1="806" y1="498" x2="484" y2="498" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="645" y="492" text-anchor="middle">⑦ RespondActivityTaskCompleted</text>
  <text class="ev" x="490" y="518">ActivityTaskStarted (attempt=2)</text>
  <text class="ev" x="490" y="534">ActivityTaskCompleted</text>

  <!-- back to workflow -->
  <line x1="476" y1="566" x2="154" y2="566" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="315" y="560" text-anchor="middle">⑧ New Workflow Task</text>
  <text class="m" x="162" y="594">future.Get(ctx, &amp;receipt)</text>
  <text class="t s" x="162" y="612">returns the result (or the final error</text>
  <text class="t s" x="162" y="627">once retries are exhausted)</text>

  <rect x="590" y="560" width="350" height="86" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text class="t s" x="602" y="580">The Service only learns a Worker died via timeouts:</text>
  <text class="t s" x="602" y="598">Start-To-Close (always) and Heartbeat (if set).</text>
  <text class="t s" x="602" y="616">ActivityTaskStarted is written only when the attempt</text>
  <text class="t s" x="602" y="634">closes, so history doesn't grow with each retry.</text>
</svg>
