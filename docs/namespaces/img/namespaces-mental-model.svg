<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="title desc">
  <title id="title">Namespaces mental model</title>
  <desc id="desc">One Temporal Service holds several Namespaces: shop-prod, billing-prod and shop-staging. Each Namespace has its own Workflow Executions, whose IDs are unique only inside it, its own Task Queues, and its own settings such as the retention period and archival. Your processes reach a Namespace through a Client dialed with that Namespace, and a Worker polls Task Queues in its Client's Namespace. Namespaces don't call each other by default; Nexus is the controlled path between them.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827;white-space:pre}
    </style>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="580" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">One Temporal Service, several isolated Namespaces</text>

  <!-- Processes -->
  <text class="t bb" x="30" y="76">Your processes</text>
  <rect x="20" y="90" width="220" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="34" y="114">orders-worker (prod)</text>
  <rect x="34" y="124" width="192" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="m" x="42" y="141">Namespace: "shop-prod"</text>
  <text class="t s" x="34" y="170">Worker polls "orders"</text>
  <text class="t s" x="34" y="186">in shop-prod only</text>

  <rect x="20" y="214" width="220" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="34" y="238">billing-worker (prod)</text>
  <rect x="34" y="248" width="192" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="m" x="42" y="265">Namespace: "billing-prod"</text>
  <text class="t s" x="34" y="294">Worker polls "billing"</text>
  <text class="t s" x="34" y="310">in billing-prod only</text>

  <rect x="20" y="338" width="220" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="34" y="362">orders-worker (staging)</text>
  <rect x="34" y="372" width="192" height="24" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="m" x="42" y="389">Namespace: "shop-staging"</text>
  <text class="t s" x="34" y="418">same code, other Namespace</text>
  <text class="t s" x="34" y="434">(set by TEMPORAL_NAMESPACE)</text>

  <!-- Service -->
  <rect x="290" y="62" width="650" height="440" rx="14" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t bb" x="306" y="86">Temporal Service</text>

  <!-- shop-prod -->
  <rect x="306" y="98" width="300" height="168" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="320" y="122">shop-prod</text>
  <text class="t s" x="320" y="144">Workflow IDs</text>
  <text class="m" x="320" y="162">order-42   invoice-42</text>
  <text class="t s" x="320" y="186">Task Queues</text>
  <text class="m" x="320" y="204">orders   shipping</text>
  <text class="t s" x="320" y="228">Settings</text>
  <text class="m" x="320" y="246">retention 30d · archival on</text>

  <!-- billing-prod -->
  <rect x="624" y="98" width="300" height="168" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="638" y="122">billing-prod</text>
  <text class="t s" x="638" y="144">Workflow IDs</text>
  <text class="m" x="638" y="162">invoice-42   refund-7</text>
  <text class="t s" x="638" y="186">Task Queues</text>
  <text class="m" x="638" y="204">billing</text>
  <text class="t s" x="638" y="228">Settings</text>
  <text class="m" x="638" y="246">retention 90d · archival on</text>

  <!-- shop-staging -->
  <rect x="306" y="304" width="300" height="168" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="320" y="328">shop-staging</text>
  <text class="t s" x="320" y="350">Workflow IDs</text>
  <text class="m" x="320" y="368">order-42</text>
  <text class="t s" x="320" y="392">Task Queues</text>
  <text class="m" x="320" y="410">orders   shipping</text>
  <text class="t s" x="320" y="434">Settings</text>
  <text class="m" x="320" y="452">retention 3d · archival off</text>

  <!-- notes -->
  <rect x="624" y="304" width="300" height="168" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t bb" x="638" y="328">What the boundary gives you</text>
  <text class="t b" x="638" y="354">• Workflow ID unique per Namespace:</text>
  <text class="t b" x="650" y="372">"invoice-42" exists twice, no conflict</text>
  <text class="t b" x="638" y="396">• Heavy traffic in one Namespace</text>
  <text class="t b" x="650" y="414">doesn't slow the others</text>
  <text class="t b" x="638" y="438">• Retention, archival, access</text>
  <text class="t b" x="650" y="456">control set per Namespace</text>

  <!-- arrows from clients -->
  <line x1="240" y1="136" x2="302" y2="166" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <path d="M 240 262 C 262 285, 280 285, 300 285 L 774 285 L 774 272" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <line x1="240" y1="390" x2="302" y2="390" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>

  <!-- nexus between namespaces -->
  <path d="M 560 98 C 585 70, 675 70, 700 94" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrp)"/>
  <text class="t bb" x="712" y="88" style="fill:#7c3aed">Nexus</text>
  <text class="t s" x="30" y="530">Blue: a Client dialed with a Namespace. Its calls, and the Workers built on it, stay in that Namespace.</text>
  <text class="t s" x="30" y="550">Purple dashed: Namespaces are isolated by default. Nexus is the controlled path from one to another.</text>
  <text class="t s" x="30" y="474">No Namespace set →</text>
  <text class="m" x="30" y="492">"default"</text>
</svg>
