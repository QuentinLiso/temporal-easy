<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Context propagation across Temporal boundaries</title>
  <desc id="desc">The Client's propagator injects the tenant from context.Context into a Temporal header. The header is stored with the WorkflowExecutionStarted event. On the Worker, ExtractToWorkflow puts it into the workflow.Context. When the Workflow starts an Activity or Child Workflow, InjectFromWorkflow writes the header again, the Service stores it with the scheduling event, and Extract or ExtractToWorkflow restores it on the other side. Header payloads are not processed by the Client's codec.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">A tenant travels in headers, not in function arguments</text>

  <!-- Client -->
  <rect x="20" y="70" width="240" height="130" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">Client (starter)</text>
  <text x="140" y="120" text-anchor="middle" font-size="12" fill="#1e293b">ctx = tenancy.WithTenant(ctx, t)</text>
  <text x="140" y="140" text-anchor="middle" font-size="12" fill="#1e293b">c.ExecuteWorkflow(ctx, …)</text>
  <circle cx="44" cy="174" r="12" fill="#4f46e5"/>
  <text x="44" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <text x="62" y="178" font-size="13" font-weight="bold" fill="#312e81">Inject: context → header</text>

  <!-- Service -->
  <rect x="320" y="56" width="300" height="350" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="470" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Temporal Service: Event History</text>
  <rect x="340" y="98" width="260" height="84" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">WorkflowExecutionStarted</text>
  <text x="470" y="142" text-anchor="middle" font-size="12" fill="#334155">header: acme-shop-tenant =</text>
  <text x="470" y="160" text-anchor="middle" font-size="12" fill="#334155">{"merchantId":"m-4471",…}</text>
  <rect x="340" y="250" width="260" height="96" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="470" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ActivityTaskScheduled /</text>
  <text x="470" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">StartChildWorkflow…Initiated</text>
  <text x="470" y="312" text-anchor="middle" font-size="12" fill="#334155">header: acme-shop-tenant =</text>
  <text x="470" y="330" text-anchor="middle" font-size="12" fill="#334155">{"merchantId":"m-4471",…}</text>
  <text x="470" y="384" text-anchor="middle" font-size="12" fill="#b91c1c">json/plain, in clear: the Client's</text>
  <text x="470" y="400" text-anchor="middle" font-size="12" fill="#b91c1c">codec is not applied to headers</text>

  <!-- Worker: Workflow -->
  <rect x="690" y="56" width="250" height="160" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="815" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">Worker: Workflow</text>
  <circle cx="712" cy="104" r="12" fill="#059669"/>
  <text x="712" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="730" y="108" font-size="13" font-weight="bold" fill="#064e3b">ExtractToWorkflow</text>
  <text x="730" y="128" font-size="12" fill="#1e293b">header → workflow.Context</text>
  <text x="730" y="148" font-size="12" fill="#1e293b">tenancy.FromWorkflow(ctx)</text>
  <circle cx="712" cy="176" r="12" fill="#059669"/>
  <text x="712" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="730" y="180" font-size="13" font-weight="bold" fill="#064e3b">InjectFromWorkflow</text>
  <text x="730" y="200" font-size="12" fill="#1e293b">on ExecuteActivity / Child</text>

  <!-- Worker: Activity -->
  <rect x="690" y="236" width="250" height="78" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="712" cy="262" r="12" fill="#059669"/>
  <text x="712" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
  <text x="730" y="266" font-size="13" font-weight="bold" fill="#064e3b">Activity: Extract</text>
  <text x="730" y="286" font-size="12" fill="#1e293b">header → context.Context</text>
  <text x="730" y="304" font-size="12" fill="#1e293b">tenancy.FromContext(ctx)</text>

  <!-- Worker: Child -->
  <rect x="690" y="328" width="250" height="78" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <circle cx="712" cy="354" r="12" fill="#059669"/>
  <text x="712" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
  <text x="730" y="358" font-size="13" font-weight="bold" fill="#064e3b">Child: ExtractToWorkflow</text>
  <text x="730" y="378" font-size="12" fill="#1e293b">same as step 2, and it can</text>
  <text x="730" y="396" font-size="12" fill="#1e293b">propagate further</text>

  <!-- Arrows -->
  <line x1="262" y1="135" x2="336" y2="135" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="602" y1="125" x2="686" y2="115" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="688" y1="190" x2="604" y2="262" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="602" y1="300" x2="686" y2="282" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="602" y1="320" x2="686" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <text x="20" y="440" font-size="13" fill="#334155">Register the same propagator on every Client (starters and Workers): a side without it neither writes nor reads the header.</text>
  <text x="20" y="460" font-size="13" fill="#334155">Signals, Queries and Updates carry headers too: see chapter 04.</text>
</svg>
