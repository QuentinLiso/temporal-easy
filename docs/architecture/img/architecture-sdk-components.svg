<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Temporal SDK components</title>
  <desc id="desc">Your code uses four parts of the Go SDK: the Temporal Client (package client), Workflow APIs (package workflow), Activity APIs (packages activity and temporal) and Worker APIs (package worker). The Client and the Worker talk to the Temporal Service over gRPC.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827}
      .n{font-size:12px;font-weight:700;fill:#ffffff}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">What the Go SDK gives you, and who uses it</text>
  <text class="t bb" x="30" y="76">Your code</text>
  <text class="t bb" x="330" y="76">Go SDK: go.temporal.io/sdk</text>
  <text class="t bb" x="730" y="76">Temporal Service</text>
  <rect x="20" y="92" width="250" height="74" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="34" y="116">cmd/orders-api/main.go</text>
  <text class="t s" x="34" y="136">HTTP handlers start loans</text>
  <rect x="330" y="92" width="330" height="74" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t bb" x="344" y="116">Temporal Client  (client)</text>
  <text class="t s" x="344" y="136">Dial · ExecuteWorkflow · Signal · Query · List</text>
  <line x1="270" y1="129" x2="326" y2="129" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="184" width="250" height="74" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="34" y="208">loans/workflow.go</text>
  <text class="t s" x="34" y="228">LoanApplicationWorkflow</text>
  <rect x="330" y="184" width="330" height="74" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t bb" x="344" y="208">Workflow APIs  (workflow)</text>
  <text class="t s" x="344" y="228">ExecuteActivity · Sleep · Signals · Queries</text>
  <line x1="270" y1="221" x2="326" y2="221" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="276" width="250" height="74" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="34" y="300">loans/activities.go</text>
  <text class="t s" x="34" y="320">CreditCheck, NotifyApplicant</text>
  <rect x="330" y="276" width="330" height="74" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t bb" x="344" y="300">Activity APIs  (activity · temporal)</text>
  <text class="t s" x="344" y="320">Heartbeat · RetryPolicy · errors</text>
  <line x1="270" y1="313" x2="326" y2="313" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="368" width="250" height="74" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="34" y="392">cmd/loan-worker/main.go</text>
  <text class="t s" x="34" y="412">registers and runs</text>
  <rect x="330" y="368" width="330" height="74" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t bb" x="344" y="392">Worker APIs  (worker)</text>
  <text class="t s" x="344" y="412">New · Register* · Run</text>
  <line x1="270" y1="405" x2="326" y2="405" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="730" y="92" width="210" height="350" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t bb" x="835" y="130" text-anchor="middle">Frontend</text>
  <text class="t s" x="835" y="150" text-anchor="middle">(gRPC)</text>
  <text class="t s" x="835" y="260" text-anchor="middle">History</text>
  <text class="t s" x="835" y="280" text-anchor="middle">Matching</text>
  <text class="t s" x="835" y="300" text-anchor="middle">Database</text>
  <line x1="660" y1="129" x2="726" y2="129" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text class="t s" x="694" y="120" text-anchor="middle">requests</text>
  <line x1="660" y1="405" x2="726" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
  <text class="t s" x="702" y="384" text-anchor="middle">poll ·</text>
  <text class="t s" x="702" y="400" text-anchor="middle">respond</text>
  <text class="t s" x="495" y="460" text-anchor="middle">Workflow and Activity code never call the Service directly: the Worker runs them and talks for them.</text>
</svg>
