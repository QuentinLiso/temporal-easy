<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Workers poll Task Queues</title>
  <desc id="desc">History adds Tasks to Task Queues held by the Matching Service. Workers long-poll their Task Queue through the Frontend and receive Tasks. Adding Workers scales out. A crashed Worker stops polling and its in-flight Task times out and goes to another Worker. With no Worker, Tasks wait on the queue.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827}
      .n{font-size:12px;font-weight:700;fill:#ffffff}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">A choreographer, not a conductor: Workers pull work</text>
  <rect x="20" y="150" width="170" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t bb" x="34" y="174">History Service</text>
  <text class="t s" x="34" y="194">“Workflow ORD-1042</text>
  <text class="t s" x="34" y="211">needs a Workflow</text>
  <text class="t s" x="34" y="228">Task”</text>
  <line x1="190" y1="210" x2="256" y2="210" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text class="t s" x="223" y="200" text-anchor="middle">add</text>
  <rect x="260" y="70" width="330" height="340" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t bb" x="425" y="96" text-anchor="middle">Matching Service</text>
  <rect x="276" y="116" width="298" height="120" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t bb" x="290" y="140">Task Queue “orders”</text>
  <rect x="290" y="156" width="54" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="317" y="178" text-anchor="middle">WT</text>
  <rect x="352" y="156" width="54" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="379" y="178" text-anchor="middle">AT</text>
  <rect x="414" y="156" width="54" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="441" y="178" text-anchor="middle">AT</text>
  <text class="t s" x="290" y="218">WT = Workflow Task · AT = Activity Task</text>
  <rect x="276" y="266" width="298" height="120" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="t bb" x="290" y="290">Task Queue “payments”</text>
  <rect x="290" y="306" width="54" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="317" y="328" text-anchor="middle">AT</text>
  <text class="t s" x="290" y="368">No Worker? Tasks wait here.</text>
  <rect x="700" y="96" width="240" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="714" y="120">orders-worker-1</text>
  <text class="t s" x="714" y="140">long-polls, runs code, responds</text>
  <line x1="696" y1="128" x2="594" y2="176" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
  <rect x="700" y="176" width="240" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="714" y="200">orders-worker-2</text>
  <text class="t s" x="714" y="220">long-polls, runs code, responds</text>
  <line x1="696" y1="208" x2="594" y2="176" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
  <rect x="700" y="256" width="240" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t bb" x="714" y="280">orders-worker-3</text>
  <text class="t s" x="714" y="300">crashed: stops polling</text>
  <line x1="696" y1="288" x2="594" y2="176" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)"/>
  <rect x="700" y="336" width="240" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="714" y="360">payments-worker-1</text>
  <text class="t s" x="714" y="380">long-polls, runs code, responds</text>
  <line x1="696" y1="368" x2="594" y2="326" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
  <text class="t s" x="645" y="444" text-anchor="middle">“Do you have work for me?” Outbound gRPC only: Workers need no inbound port.</text>
  <text class="t s" x="30" y="444">Scale out = start more Workers on the same queue.</text>
</svg>
