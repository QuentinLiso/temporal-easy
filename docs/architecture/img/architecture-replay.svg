<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Commands, Events and Replay</title>
  <desc id="desc">On the day-30 Workflow Task a new Worker replays InvoiceWorkflow against its Event History. SendInvoice and the 30-day Timer already have matching Events, so their results are reused and no Command is sent. CheckPayment has no Event yet, so replay ends and a new ScheduleActivityTask Command is sent. A Command that does not match the recorded Events raises a non-determinism error.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827}
      .n{font-size:12px;font-weight:700;fill:#ffffff}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">Replay: same code, recorded results, then new Commands</text>
  <text class="t bb" x="30" y="74">Workflow code (InvoiceWorkflow)</text>
  <text class="t bb" x="360" y="74">Event History (recorded)</text>
  <text class="t bb" x="690" y="74">What the SDK does on replay</text>
  <rect x="20" y="92" width="300" height="86" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="34" y="116"></text>
  <text class="m" x="34" y="136">(A) ExecuteActivity(SendInvoice)</text>
  <rect x="360" y="92" width="290" height="86" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="m" x="376" y="126">ActivityTaskScheduled</text>
  <text class="m" x="376" y="148">ActivityTaskCompleted</text>
  <rect x="690" y="92" width="250" height="86" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="704" y="116">Match: no Command, reuse result.</text>
  <text class="t s" x="704" y="136">No email is sent again.</text>
  <line x1="320" y1="135" x2="356" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="135" x2="686" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="202" width="300" height="86" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="34" y="226"></text>
  <text class="m" x="34" y="246">(B) workflow.Sleep(30 days)</text>
  <rect x="360" y="202" width="290" height="86" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="m" x="376" y="236">TimerStarted</text>
  <text class="m" x="376" y="258">TimerFired</text>
  <rect x="690" y="202" width="250" height="86" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="704" y="226">Match: Timer already fired.</text>
  <text class="t s" x="704" y="246">Sleep returns at once.</text>
  <line x1="320" y1="245" x2="356" y2="245" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="245" x2="686" y2="245" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="312" width="300" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="34" y="336"></text>
  <text class="m" x="34" y="356">(C) ExecuteActivity(CheckPayment)</text>
  <rect x="360" y="312" width="290" height="86" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text class="m" x="376" y="346">(nothing yet)</text>
  <rect x="690" y="312" width="250" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="704" y="336">No Event: replay is over.</text>
  <text class="t s" x="704" y="356">Send ScheduleActivityTask.</text>
  <line x1="320" y1="355" x2="356" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="650" y1="355" x2="686" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="20" y="432" width="920" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t bb" x="36" y="458">Mismatch → non-determinism error</text>
  <text class="t s" x="36" y="480">New code asks for ScreenForFraud where the history recorded SendInvoice: the SDK cannot reuse the</text>
  <text class="t s" x="36" y="496">recorded Events, so the Workflow Task fails until the code is fixed or versioned.</text>
</svg>
