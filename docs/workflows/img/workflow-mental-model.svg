<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Temporal Workflow mental model</title>
  <desc id="desc">A client starts a Workflow Execution in the Temporal Service. The Service records an Event History and puts Workflow Tasks on a Task Queue. A Worker polls the Task Queue, runs the Workflow code, sends Commands back and runs Activities. Below, one Workflow Definition maps to one Workflow Type and many Workflow Executions.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#111827}
      .ev{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#6d28d9}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">How a Workflow runs: Client, Temporal Service, Worker</text>

  <!-- Client -->
  <rect x="30" y="70" width="230" height="150" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="145" y="96" text-anchor="middle">Client (your app)</text>
  <text class="m" style="font-size:10.5px" x="44" y="124">c.ExecuteWorkflow(ctx,</text>
  <text class="m" style="font-size:10.5px" x="57" y="141">StartWorkflowOptions{</text>
  <text class="m" style="font-size:10.5px" x="71" y="158">ID: "signup-c-42",</text>
  <text class="m" style="font-size:10.5px" x="71" y="175">TaskQueue: "subscriptions"},</text>
  <text class="m" style="font-size:10.5px" x="57" y="192">SubscriptionSignupWorkflow,</text>
  <text class="m" style="font-size:10.5px" x="57" y="209">input)</text>

  <!-- Service -->
  <rect x="330" y="60" width="300" height="350" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t h" x="480" y="86" text-anchor="middle">Temporal Service</text>
  <rect x="350" y="102" width="260" height="170" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text class="t b" x="480" y="122" text-anchor="middle" font-weight="700">Event History of "signup-c-42"</text>
  <text class="ev" x="364" y="145">1 WorkflowExecutionStarted</text>
  <text class="ev" x="364" y="163">2 WorkflowTaskScheduled</text>
  <text class="ev" x="364" y="181">… WorkflowTaskCompleted</text>
  <text class="ev" x="364" y="199">… ActivityTaskScheduled</text>
  <text class="ev" x="364" y="217">… ActivityTaskCompleted</text>
  <text class="ev" x="364" y="235">… TimerStarted (14 days)</text>
  <text class="t s" x="480" y="260" text-anchor="middle">append-only · durable · source of truth</text>
  <rect x="350" y="290" width="260" height="100" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text class="t b" x="480" y="312" text-anchor="middle" font-weight="700">Task Queue "subscriptions"</text>
  <rect x="368" y="326" width="70" height="26" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text class="t s" x="403" y="343" text-anchor="middle">WF Task</text>
  <rect x="446" y="326" width="70" height="26" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text class="t s" x="481" y="343" text-anchor="middle">Act Task</text>
  <rect x="524" y="326" width="70" height="26" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
  <text class="t s" x="559" y="343" text-anchor="middle">WF Task</text>
  <text class="t s" x="480" y="376" text-anchor="middle">Workers pull; the Service never pushes</text>

  <!-- Worker -->
  <rect x="700" y="60" width="230" height="350" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="815" y="86" text-anchor="middle">Worker (your process)</text>
  <rect x="716" y="102" width="198" height="150" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text class="t b" x="815" y="122" text-anchor="middle" font-weight="700">Workflow code</text>
  <text class="t s" x="815" y="140" text-anchor="middle">deterministic orchestration</text>
  <text class="m" x="728" y="164">ExecuteActivity(…)</text>
  <text class="m" x="728" y="182">workflow.Sleep(14 days)</text>
  <text class="m" x="728" y="200">return result</text>
  <text class="t s" x="815" y="226" text-anchor="middle">→ emits Commands</text>
  <text class="t s" x="815" y="242" text-anchor="middle">re-run on replay</text>
  <rect x="716" y="268" width="198" height="122" rx="8" fill="#ffffff" stroke="#059669"/>
  <text class="t b" x="815" y="288" text-anchor="middle" font-weight="700">Activities</text>
  <text class="t s" x="815" y="306" text-anchor="middle">side effects: APIs, DB, email</text>
  <text class="m" x="728" y="330">CreateAccount</text>
  <text class="m" x="728" y="348">ChargeFirstInvoice</text>
  <text class="m" x="728" y="366">SendWelcomeEmail</text>

  <!-- Arrows -->
  <line x1="260" y1="130" x2="346" y2="130" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="295" y="121" text-anchor="middle">① start</text>

  <line x1="700" y1="330" x2="614" y2="330" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="657" y="322" text-anchor="middle">② poll</text>
  <line x1="614" y1="360" x2="712" y2="360" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t s" x="657" y="378" text-anchor="middle">Task</text>

  <line x1="700" y1="180" x2="614" y2="180" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t b" x="657" y="172" text-anchor="middle">③ Commands</text>
  <text class="t s" x="657" y="198" text-anchor="middle">→ Events</text>

  <line x1="260" y1="200" x2="346" y2="240" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)"/>
  <text class="t b" x="145" y="246" text-anchor="middle">④ run.Get(&amp;result)</text>
  <text class="t s" x="145" y="262" text-anchor="middle">when the Execution closes</text>

  <!-- Cardinality -->
  <text class="t h" x="30" y="450">One Definition → one Type → many Executions</text>
  <rect x="30" y="470" width="200" height="140" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t b" x="130" y="494" text-anchor="middle" font-weight="700">Workflow Definition</text>
  <text class="t s" x="130" y="512" text-anchor="middle">the code</text>
  <text class="m" x="44" y="544">func SubscriptionSignup</text>
  <text class="m" x="57" y="561">Workflow(ctx, in)</text>
  <text class="m" x="57" y="578">(SignupResult, error)</text>

  <line x1="230" y1="540" x2="286" y2="540" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t s" x="258" y="530" text-anchor="middle">named</text>

  <rect x="290" y="470" width="220" height="140" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t b" x="400" y="494" text-anchor="middle" font-weight="700">Workflow Type</text>
  <text class="t s" x="400" y="512" text-anchor="middle">the name</text>
  <text class="m" x="400" y="546" text-anchor="middle">"SubscriptionSignupWorkflow"</text>
  <text class="t s" x="400" y="576" text-anchor="middle">scoped by Task Queue</text>
  <text class="t s" x="400" y="593" text-anchor="middle">(Workers that registered it)</text>

  <line x1="510" y1="540" x2="566" y2="540" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t s" x="538" y="530" text-anchor="middle">1 → N</text>

  <rect x="570" y="470" width="360" height="40" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="m" x="586" y="495">signup-c-42</text>
  <text class="t s" x="914" y="495" text-anchor="end">Running · own history</text>
  <rect x="570" y="520" width="360" height="40" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="m" x="586" y="545">signup-c-43</text>
  <text class="t s" x="914" y="545" text-anchor="end">Completed · own history</text>
  <rect x="570" y="570" width="360" height="40" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="m" x="586" y="595">signup-c-44</text>
  <text class="t s" x="914" y="595" text-anchor="end">Running · own history</text>
</svg>
