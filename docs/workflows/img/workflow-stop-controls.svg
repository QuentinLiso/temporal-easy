<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Cancel, Terminate, Pause and Reset compared</title>
  <desc id="desc">Four controls that stop or steer a Workflow Execution. For each: who sees the request, what runs, the resulting status and when to use it.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#111827}
      .lbl{font-size:12px;font-weight:700;fill:#374151}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">Four ways to stop or steer a running Workflow Execution</text>
  <text class="t s" x="30" y="54">Operator / client sends a request → Temporal Service → (maybe) your Workflow code</text>

  <!-- Row labels -->
  <text class="t lbl" x="30" y="150">Request</text>
  <text class="t lbl" x="30" y="222">Workflow</text>
  <text class="t lbl" x="30" y="238">code sees it?</text>
  <text class="t lbl" x="30" y="312">What runs</text>
  <text class="t lbl" x="30" y="402">Resulting</text>
  <text class="t lbl" x="30" y="418">status</text>
  <text class="t lbl" x="30" y="500">Use when</text>

  <!-- Column: Cancel -->
  <rect x="140" y="72" width="190" height="44" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="t h" x="235" y="92" text-anchor="middle">Cancel</text>
  <text class="t s" x="235" y="108" text-anchor="middle">cooperative · preferred</text>
  <rect x="140" y="130" width="190" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="m" x="235" y="151" text-anchor="middle">CancelRequested event</text>
  <rect x="140" y="200" width="190" height="46" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text class="t b" x="235" y="220" text-anchor="middle">✅ Yes: ctx is canceled</text>
  <text class="m" x="235" y="237" text-anchor="middle">workflow.ErrCanceled</text>
  <rect x="140" y="270" width="190" height="88" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t b" x="235" y="292" text-anchor="middle">Your cleanup (defer +</text>
  <text class="m" x="235" y="309" text-anchor="middle">NewDisconnectedContext)</text>
  <text class="t b" x="235" y="328" text-anchor="middle">Activities stop only</text>
  <text class="t b" x="235" y="345" text-anchor="middle">if they heartbeat</text>
  <rect x="140" y="380" width="190" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t b" x="235" y="401" text-anchor="middle">Canceled (error returned)</text>
  <text class="t b" x="235" y="419" text-anchor="middle">or Completed (handled)</text>
  <text class="t s" x="235" y="486" text-anchor="middle">The business process should</text>
  <text class="t s" x="235" y="502" text-anchor="middle">stop and undo its work</text>

  <!-- Column: Terminate -->
  <rect x="345" y="72" width="190" height="44" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t h" x="440" y="92" text-anchor="middle">Terminate</text>
  <text class="t s" x="440" y="108" text-anchor="middle">forceful · immediate</text>
  <rect x="345" y="130" width="190" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="m" x="440" y="151" text-anchor="middle">Terminated event (closing)</text>
  <rect x="345" y="200" width="190" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t b" x="440" y="220" text-anchor="middle">❌ No</text>
  <text class="t s" x="440" y="237" text-anchor="middle">code never sees it</text>
  <rect x="345" y="270" width="190" height="88" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t b" x="440" y="296" text-anchor="middle">Nothing runs</text>
  <text class="t b" x="440" y="316" text-anchor="middle">no cleanup, no compensation</text>
  <text class="t s" x="440" y="338" text-anchor="middle">leftovers stay as they are</text>
  <rect x="345" y="380" width="190" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t b" x="440" y="410" text-anchor="middle">Terminated</text>
  <text class="t s" x="440" y="486" text-anchor="middle">Cancel can't take effect: stuck</text>
  <text class="t s" x="440" y="502" text-anchor="middle">on an NDE, or no Workers</text>

  <!-- Column: Pause -->
  <rect x="550" y="72" width="190" height="44" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="t h" x="645" y="92" text-anchor="middle">Pause / Unpause</text>
  <text class="t s" x="645" y="108" text-anchor="middle">Pre-release · stays Open</text>
  <rect x="550" y="130" width="190" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="m" x="645" y="151" text-anchor="middle">Pause recorded in history</text>
  <rect x="550" y="200" width="190" height="46" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text class="t b" x="645" y="220" text-anchor="middle">❌ No: it just stops</text>
  <text class="t b" x="645" y="237" text-anchor="middle">getting Workflow Tasks</text>
  <rect x="550" y="270" width="190" height="88" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text class="t b" x="645" y="286" text-anchor="middle">No new Workflow or</text>
  <text class="t b" x="645" y="301" text-anchor="middle">Activity Tasks</text>
  <text class="t s" x="645" y="319" text-anchor="middle">running attempts finish · Timers tick</text>
  <text class="t s" x="645" y="334" text-anchor="middle">Signals queue up</text>
  <text class="t s" x="645" y="349" text-anchor="middle">Updates and Queries rejected</text>
  <rect x="550" y="380" width="190" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t b" x="645" y="401" text-anchor="middle">Paused (Open)</text>
  <text class="t s" x="645" y="419" text-anchor="middle">→ Running after Unpause</text>
  <text class="t s" x="645" y="486" text-anchor="middle">A dependency is down, or you</text>
  <text class="t s" x="645" y="502" text-anchor="middle">need time to investigate</text>

  <!-- Column: Reset -->
  <rect x="755" y="72" width="180" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="845" y="92" text-anchor="middle">Reset</text>
  <text class="t s" x="845" y="108" text-anchor="middle">rewind · new Run</text>
  <rect x="755" y="130" width="180" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="m" x="845" y="151" text-anchor="middle">reset to event ID N</text>
  <rect x="755" y="200" width="180" height="46" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text class="t b" x="845" y="220" text-anchor="middle">❌ No: old Run is</text>
  <text class="t b" x="845" y="237" text-anchor="middle">terminated</text>
  <rect x="755" y="270" width="180" height="88" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t b" x="845" y="290" text-anchor="middle">New Run replays history</text>
  <text class="t b" x="845" y="306" text-anchor="middle">up to N, then continues</text>
  <text class="t b" x="845" y="322" text-anchor="middle">with the current code</text>
  <text class="t s" x="845" y="342" text-anchor="middle">Signals optionally copied</text>
  <rect x="755" y="380" width="180" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t b" x="845" y="401" text-anchor="middle">old Run: Terminated</text>
  <text class="t b" x="845" y="419" text-anchor="middle">new Run: Running</text>
  <text class="t s" x="845" y="486" text-anchor="middle">You fixed and deployed</text>
  <text class="t s" x="845" y="502" text-anchor="middle">a non-determinism bug</text>

  <!-- Bottom rule -->
  <line x1="30" y1="530" x2="930" y2="530" stroke="#e5e7eb"/>
  <text class="t b" x="30" y="556">Rule of thumb: <tspan font-weight="700">cancel first</tspan>, terminate only if the cancellation can't take effect.</text>
  <text class="t s" x="30" y="578">Cancel and Terminate accept a List Filter for bulk actions. Pause works on one Execution at a time. A Terminate request also works on a Paused Workflow.</text>
</svg>
