<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Continue-As-New Execution Chain</title>
  <desc id="desc">Three Runs of the same Workflow ID. Each Run has its own Run ID and a fresh Event History. The state is passed as input to the next Run. Signals are drained before the switch, and clients that address the Workflow ID reach the current Run.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#111827}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">Continue-As-New: one Workflow ID, a chain of Runs, each with a fresh history</text>

  <!-- Chain banner -->
  <rect x="30" y="52" width="900" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t b" x="480" y="75" text-anchor="middle">Workflow Execution Chain · Workflow ID <tspan class="m">loyalty-C-1001</tspan> · Execution Timeout covers the whole chain</text>

  <!-- Run 1 -->
  <rect x="30" y="108" width="250" height="232" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text class="t h" x="155" y="132" text-anchor="middle">Run 1</text>
  <text class="m" x="155" y="150" text-anchor="middle">Run ID 7f3a…</text>
  <text class="t s" x="50" y="176">Input: State = nil (first caller)</text>
  <text class="t s" x="50" y="198">Event History</text>
  <rect x="50" y="206" width="210" height="16" rx="3" fill="#e5e7eb"/>
  <rect x="50" y="206" width="200" height="16" rx="3" fill="#fbbf24"/>
  <text class="t s" x="50" y="240">grows with every Signal, Timer,</text>
  <text class="t s" x="50" y="256">Activity… until CAN is suggested</text>
  <rect x="50" y="290" width="210" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t b" x="155" y="312" text-anchor="middle">Continued-As-New (Closed)</text>

  <!-- Run 2 -->
  <rect x="355" y="108" width="250" height="232" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text class="t h" x="480" y="132" text-anchor="middle">Run 2</text>
  <text class="m" x="480" y="150" text-anchor="middle">Run ID c91e…</text>
  <text class="t s" x="375" y="176">Input: State from Run 1</text>
  <text class="t s" x="375" y="198">Event History (starts empty)</text>
  <rect x="375" y="206" width="210" height="16" rx="3" fill="#e5e7eb"/>
  <rect x="375" y="206" width="200" height="16" rx="3" fill="#fbbf24"/>
  <text class="t s" x="375" y="240">rebuilds Timers from carried</text>
  <text class="t s" x="375" y="256">deadlines, keeps going</text>
  <rect x="375" y="290" width="210" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t b" x="480" y="312" text-anchor="middle">Continued-As-New (Closed)</text>

  <!-- Run 3 -->
  <rect x="680" y="108" width="250" height="232" rx="10" fill="#f9fafb" stroke="#059669"/>
  <text class="t h" x="805" y="132" text-anchor="middle">Run 3 (current)</text>
  <text class="m" x="805" y="150" text-anchor="middle">Run ID 2b07…</text>
  <text class="t s" x="700" y="176">Input: State from Run 2</text>
  <text class="t s" x="700" y="198">Event History (starts empty)</text>
  <rect x="700" y="206" width="210" height="16" rx="3" fill="#e5e7eb"/>
  <rect x="700" y="206" width="40" height="16" rx="3" fill="#34d399"/>
  <text class="t s" x="700" y="240">small history: fast replay,</text>
  <text class="t s" x="700" y="256">far from the 51,200-event limit</text>
  <rect x="700" y="290" width="210" height="34" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text class="t b" x="805" y="312" text-anchor="middle">Running (Open)</text>

  <!-- Arrows between runs -->
  <line x1="280" y1="224" x2="352" y2="224" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="605" y1="224" x2="677" y2="224" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- State payload card -->
  <rect x="30" y="362" width="575" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="m" x="46" y="384">return workflow.NewContinueAsNewError(ctx, LoyaltyAccountWorkflow,</text>
  <text class="m" x="46" y="402">    LoyaltyAccountInput{CustomerID: id, State: &amp;state})</text>
  <text class="t s" x="46" y="418">state = Balance, LifetimeEarned, NextExpiryAt… (small: it's an input payload)</text>

  <!-- Boundary checklist -->
  <rect x="30" y="440" width="575" height="140" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="t h" x="46" y="464">At the boundary, in the main Workflow function</text>
  <text class="t b" x="46" y="488">① Decide: GetInfo(ctx).GetContinueAsNewSuggested() (or a test hook)</text>
  <text class="t b" x="46" y="510">② workflow.Await(ctx, AllHandlersFinished): never CAN from a handler</text>
  <text class="t b" x="46" y="532">③ Drain Signal channels with ReceiveAsync → apply them to the state</text>
  <text class="t b" x="46" y="554">④ Return the Continue-As-New error. Unreceived Signals would be lost.</text>
  <text class="t s" x="46" y="572">Timers and pending Activities belong to the old Run: carry deadlines, not Timers.</text>

  <!-- Client box -->
  <rect x="630" y="362" width="300" height="218" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="645" y="386">Clients don't care which Run</text>
  <text class="m" x="645" y="410">SignalWorkflow(ctx, "loyalty-C-1001",</text>
  <text class="m" x="645" y="426">    "", "points-earned", e)</text>
  <text class="m" x="645" y="448">QueryWorkflow(ctx, "loyalty-C-1001",</text>
  <text class="m" x="645" y="464">    "", "balance")</text>
  <text class="t s" x="645" y="490">Empty Run ID = the current Run.</text>
  <text class="t s" x="645" y="508">A Signal sent after the switch lands in</text>
  <text class="t s" x="645" y="524">the new Run's history.</text>
  <text class="t s" x="645" y="548">Don't store or branch on Run IDs:</text>
  <text class="t s" x="645" y="564">they change on every Continue-As-New.</text>
  <line x1="805" y1="362" x2="805" y2="344" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrB)"/>
</svg>
