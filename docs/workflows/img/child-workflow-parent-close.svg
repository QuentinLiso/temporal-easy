<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Parent Close Policy</title>
  <desc id="desc">When a parent Workflow closes, each still-running Child Workflow is handled according to its own Parent Close Policy: Terminate (the default) closes it immediately without cleanup, Request Cancel sends it a Cancellation request so it can clean up, and Abandon leaves it running.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#111827}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">What happens to a running child when its parent closes?</text>

  <!-- Parent -->
  <rect x="300" y="54" width="360" height="62" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="480" y="78" text-anchor="middle">Parent Workflow reaches a Closed status</text>
  <text class="t s" x="480" y="100" text-anchor="middle">completed · failed · timed out · …</text>

  <!-- arrows to columns -->
  <path d="M400,116 L170,160" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M480,116 L480,160" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M560,116 L790,160" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Column 1: Terminate -->
  <rect x="40" y="164" width="260" height="36" rx="18" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="m" x="170" y="187" text-anchor="middle">TERMINATE  (default)</text>
  <rect x="70" y="220" width="200" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t b" x="170" y="245" text-anchor="middle">child still running</text>
  <line x1="170" y1="260" x2="170" y2="292" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="296" width="260" height="104" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t h" x="170" y="322" text-anchor="middle">Child is Terminated</text>
  <text class="t b" x="170" y="344" text-anchor="middle">immediately · its code never sees it</text>
  <text class="t b" x="170" y="362" text-anchor="middle">no cleanup, no compensation</text>
  <text class="t s" x="170" y="386" text-anchor="middle">closing status: Terminated</text>
  <text class="t s" x="170" y="428" text-anchor="middle">use for: helpers only the parent needs</text>

  <!-- Column 2: Request cancel -->
  <rect x="350" y="164" width="260" height="36" rx="18" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="m" x="480" y="187" text-anchor="middle">REQUEST_CANCEL</text>
  <rect x="380" y="220" width="200" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t b" x="480" y="245" text-anchor="middle">child still running</text>
  <line x1="480" y1="260" x2="480" y2="292" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="350" y="296" width="260" height="104" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="t h" x="480" y="322" text-anchor="middle">Cancellation request sent</text>
  <text class="t b" x="480" y="344" text-anchor="middle">child code sees a Cancelled Failure</text>
  <text class="t b" x="480" y="362" text-anchor="middle">runs its cleanup, then closes</text>
  <text class="t s" x="480" y="386" text-anchor="middle">closing status: Canceled (or Completed)</text>
  <text class="t s" x="480" y="428" text-anchor="middle">use for: RepriceCategoryWorkflow</text>

  <!-- Column 3: Abandon -->
  <rect x="660" y="164" width="260" height="36" rx="18" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="m" x="790" y="187" text-anchor="middle">ABANDON</text>
  <rect x="690" y="220" width="200" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t b" x="790" y="245" text-anchor="middle">child still running</text>
  <line x1="790" y1="260" x2="790" y2="292" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="660" y="296" width="260" height="104" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text class="t h" x="790" y="322" text-anchor="middle">Child keeps running</text>
  <text class="t b" x="790" y="344" text-anchor="middle">not affected by the parent</text>
  <text class="t b" x="790" y="362" text-anchor="middle">finishes on its own</text>
  <text class="t s" x="790" y="386" text-anchor="middle">closing status: whatever it returns</text>
  <text class="t s" x="790" y="428" text-anchor="middle">use for: PriceChangeAuditWorkflow</text>

  <!-- Footer -->
  <line x1="30" y1="456" x2="930" y2="456" stroke="#e5e7eb"/>
  <text class="t b" x="30" y="484">The policy is set <tspan font-weight="700">per child</tspan>:
    <tspan class="m">workflow.ChildWorkflowOptions{ParentClosePolicy: enumspb.PARENT_CLOSE_POLICY_…}</tspan></text>
  <text class="t b" x="30" y="510">Abandoned (fire-and-forget) child: wait for <tspan class="m">future.GetChildWorkflowExecution().Get(…)</tspan> before the parent completes,</text>
  <text class="t b" x="30" y="530">otherwise the child may never be started.</text>
</svg>
