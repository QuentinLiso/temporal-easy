<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Workflow replay</title>
  <desc id="desc">Worker A runs RefundRequestWorkflow: each Workflow API call emits a Command that the Temporal Service records as Events. Worker A crashes. Worker B replays the code from the top, matches every Command with the recorded Events, reuses the recorded SideEffect value and Activity result, then continues live. If the code changed so a Command does not match, the Workflow Task fails with a non-determinism error.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#111827}
      .ev{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#6d28d9}
      .ok{font-size:12px;fill:#047857;font-weight:600}
      .ko{font-size:12px;fill:#b91c1c;font-weight:600}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="760" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">Replay: re-run the code, match Commands against the Event History</text>

  <!-- ===== Event History (shared, right column) ===== -->
  <rect x="640" y="56" width="290" height="440" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t h" x="785" y="82" text-anchor="middle">Event History (Service)</text>
  <text class="ev" x="656" y="112">1-4 Started, Workflow Task…</text>
  <rect x="650" y="124" width="270" height="44" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text class="ev" x="660" y="142">5 MarkerRecorded</text>
  <text class="t s" x="660" y="159">SideEffect → "RF-9f2c"</text>
  <rect x="650" y="174" width="270" height="44" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text class="ev" x="660" y="192">6 MarkerRecorded</text>
  <text class="t s" x="660" y="209">MutableSideEffect → 5000</text>
  <rect x="650" y="224" width="270" height="62" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text class="ev" x="660" y="242">7 ActivityTaskScheduled (IssueRefund)</text>
  <text class="ev" x="660" y="259">8 ActivityTaskStarted</text>
  <text class="ev" x="660" y="276">9 ActivityTaskCompleted "re_RF-9f2c"</text>
  <text class="ev" x="656" y="306">10-12 Workflow Task…</text>
  <rect x="650" y="318" width="270" height="30" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text class="ev" x="660" y="338" style="fill:#047857">13 WorkflowExecutionCompleted</text>
  <text class="t s" x="785" y="372" text-anchor="middle">(written by Worker B, live)</text>
  <text class="t s" x="785" y="410" text-anchor="middle">append-only · durable</text>
  <text class="t s" x="785" y="428" text-anchor="middle">one history per Execution</text>
  <text class="t s" x="785" y="446" text-anchor="middle">Activities are never re-run</text>
  <text class="t s" x="785" y="464" text-anchor="middle">to rebuild state</text>

  <!-- ===== A: first execution ===== -->
  <rect x="30" y="56" width="580" height="170" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="46" y="80">A · First execution on Worker A</text>
  <text class="t s" x="46" y="98">Workflow code</text>
  <text class="t s" x="330" y="98">Command sent with the Workflow Task</text>
  <text class="m" x="46" y="140">SideEffect(newRefundReference)</text>
  <text class="m" x="330" y="140">RecordMarker</text>
  <line x1="440" y1="136" x2="646" y2="146" stroke="#374151" stroke-width="1.3" marker-end="url(#arr)"/>
  <text class="m" x="46" y="170">MutableSideEffect("threshold")</text>
  <text class="m" x="330" y="170">RecordMarker</text>
  <line x1="440" y1="166" x2="646" y2="196" stroke="#374151" stroke-width="1.3" marker-end="url(#arr)"/>
  <text class="m" x="46" y="200">ExecuteActivity(IssueRefund)</text>
  <text class="m" x="330" y="200">ScheduleActivityTask</text>
  <line x1="490" y1="196" x2="646" y2="244" stroke="#374151" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- crash -->
  <rect x="30" y="238" width="580" height="40" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t b" x="46" y="263">💥 Worker A crashes while IssueRefund runs. The Activity still completes (events 8–9).</text>

  <!-- ===== B: replay ===== -->
  <rect x="30" y="290" width="580" height="206" rx="10" fill="#d1fae5" stroke="#059669"/>
  <text class="t h" x="46" y="314">B · Replay on Worker B (code runs from the top)</text>
  <text class="m" x="46" y="344">SideEffect(newRefundReference)</text>
  <text class="t ok" x="330" y="344">✓ matches 5 → "RF-9f2c"</text>
  <text class="t s" x="330" y="360">function NOT called again</text>
  <text class="m" x="46" y="388">MutableSideEffect("threshold")</text>
  <text class="t ok" x="330" y="388">✓ matches 6 → 5000</text>
  <text class="m" x="46" y="424">ExecuteActivity(IssueRefund)</text>
  <text class="t ok" x="330" y="424">✓ matches 7, result from 9</text>
  <text class="t s" x="330" y="440">Future resolves at once, no new call</text>
  <line x1="30" y1="454" x2="610" y2="454" stroke="#059669" stroke-dasharray="2 3"/>
  <text class="t s" x="46" y="470">end of recorded history: from here the code is live again</text>
  <text class="m" x="46" y="488">return res</text>
  <text class="m" x="330" y="488">CompleteWorkflowExecution</text>
  <line x1="520" y1="484" x2="646" y2="336" stroke="#374151" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ===== C: mismatch ===== -->
  <rect x="30" y="520" width="900" height="210" rx="10" fill="#fff7f7" stroke="#dc2626"/>
  <text class="t h" x="46" y="546">C · Same history, but someone changed the code and redeployed</text>
  <text class="t s" x="46" y="568">New code (e.g. manual review moved before the refund):</text>
  <text class="m" x="46" y="596">SideEffect(newRefundReference)</text>
  <text class="t ok" x="330" y="596">✓ matches 5</text>
  <text class="m" x="46" y="620">MutableSideEffect("threshold")</text>
  <text class="t ok" x="330" y="620">✓ matches 6</text>
  <text class="m" x="46" y="644">ExecuteActivity(OpenManualReviewTicket)</text>
  <text class="t ko" x="380" y="644">✕ history says 7 = ActivityTaskScheduled(IssueRefund)</text>
  <rect x="46" y="660" width="868" height="56" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t b" x="62" y="683" font-weight="700">Non-determinism error → the Workflow Task fails and is retried; the Execution is stuck until the code is fixed.</text>
  <text class="t s" x="62" y="703">Prevent it: version the change (GetVersion / Worker Versioning, chapter 11) and run replay tests in CI.</text>
</svg>
