<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Patching lifecycle with workflow.GetVersion</title>
  <desc id="desc">Four deployments of ShipOrderWorkflow: original code, GetVersion with max 1, GetVersion with max 2, and minSupported raised to 1. Executions started on each deployment keep the branch recorded in their history, while new executions take the newest branch.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:15px;font-weight:700}
      .b{font-size:12.5px}
      .s{font-size:11.5px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#111827}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="34">Patching ShipOrderWorkflow with GetVersion(ctx, "carrier-api", min, max)</text>

  <!-- timeline -->
  <line x1="40" y1="70" x2="930" y2="70" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t s" x="900" y="60" text-anchor="end">deployments over time</text>

  <!-- Deployment columns -->
  <rect x="40" y="86" width="205" height="128" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="54" y="110">Stage 0 (original)</text>
  <text class="t s" x="54" y="130">no GetVersion call</text>
  <text class="m" x="54" y="156">ReserveCarrierLegacy</text>
  <text class="m" x="54" y="176">PrintLabel</text>

  <rect x="263" y="86" width="205" height="128" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="277" y="110">Stage 1</text>
  <text class="m" x="277" y="132">GetVersion(Default, 1)</text>
  <text class="m" x="277" y="156">Default → Legacy</text>
  <text class="m" x="277" y="176">1       → V2</text>

  <rect x="486" y="86" width="205" height="128" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="500" y="110">Stage 2</text>
  <text class="m" x="500" y="132">GetVersion(Default, 2)</text>
  <text class="m" x="500" y="156">Default → Legacy</text>
  <text class="m" x="500" y="174">1       → V2</text>
  <text class="m" x="500" y="192">2       → BestRate</text>

  <rect x="709" y="86" width="221" height="128" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t h" x="723" y="110">Stage 3 (min raised)</text>
  <text class="m" x="723" y="132">GetVersion(1, 2)</text>
  <text class="m" x="723" y="156">1 → V2</text>
  <text class="m" x="723" y="174">2 → BestRate</text>
  <text class="t s" x="723" y="198">Default branch deleted</text>

  <!-- Execution lanes -->
  <text class="t h" x="40" y="252">Executions (each keeps the branch its history recorded)</text>

  <!-- Exec A: started stage 0 -->
  <text class="t b" x="40" y="286">A · started on stage 0</text>
  <rect x="40" y="296" width="650" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text class="t b" x="52" y="318">already past the step: no marker → replay returns DefaultVersion → Legacy ✓</text>
  <rect x="700" y="296" width="230" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t b" x="712" y="318">on stage 3: fails fast ✕</text>

  <!-- Exec B: started stage 1 -->
  <text class="t b" x="263" y="364">B · started on stage 1</text>
  <rect x="263" y="374" width="667" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text class="t b" x="275" y="396">marker "carrier-api" = 1 → always ReserveCarrierV2, even on stage 2 and 3 ✓</text>

  <!-- Exec C: started stage 2 -->
  <text class="t b" x="486" y="442">C · started on stage 2</text>
  <rect x="486" y="452" width="444" height="34" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text class="t b" x="498" y="474">first run: records max = 2 → ReserveCarrierBestRate ✓</text>

  <!-- Bottom notes -->
  <rect x="40" y="510" width="890" height="70" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text class="t b" x="54" y="534">Raise min only when the List Filter  TemporalChangeVersion IS NULL  (and later  = "carrier-api-1")  finds no open Execution,</text>
  <text class="t b" x="54" y="556">and closed ones are past retention. Then keep the call: GetVersion(ctx, "carrier-api", 2, 2). Never reuse a removed changeID.</text>
</svg>
