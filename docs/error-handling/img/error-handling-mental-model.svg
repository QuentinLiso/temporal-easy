<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Platform failures vs application failures</title>
  <desc id="desc">Failures come from the platform (Worker crash, network cut, Service restart) or from your code (transient errors, permanent errors, bugs in Workflow code). Temporal handles platform failures and transient errors through replay, new Activity attempts and the Retry Policy, so the Workflow continues (forward recovery). Permanent errors reach your Workflow code, which compensates or fails (backward recovery). Bugs in Workflow code fail the Workflow Task, which is retried until you deploy a fix.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">Where a failure comes from decides who handles it</text>

  <text class="t bb" x="30" y="78">Where it fails</text>
  <text class="t bb" x="360" y="78">Who handles it</text>
  <text class="t bb" x="690" y="78">Outcome</text>

  <!-- Platform -->
  <rect x="20" y="92" width="280" height="118" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t bb" x="36" y="116">Platform failures</text>
  <text class="t b" x="36" y="140">Worker crash or deploy</text>
  <text class="t b" x="36" y="160">Network cut</text>
  <text class="t b" x="36" y="180">Temporal Service restart</text>
  <text class="t s" x="36" y="200">no Temporal error object</text>

  <!-- App transient -->
  <rect x="20" y="226" width="280" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="36" y="250">Transient application errors</text>
  <text class="t b" x="36" y="272">gateway 503, API timeout, lock busy</text>
  <text class="t s" x="36" y="292">an Activity returns an error</text>

  <!-- App permanent -->
  <rect x="20" y="322" width="280" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t bb" x="36" y="346">Permanent application errors</text>
  <text class="t b" x="36" y="368">card declined, invalid address</text>
  <text class="t s" x="36" y="388">retrying won't help</text>

  <!-- Bug -->
  <rect x="20" y="418" width="280" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="36" y="442">Bugs in Workflow code</text>
  <text class="t b" x="36" y="464">panic, non-determinism</text>
  <text class="t s" x="36" y="484">a new deploy is needed</text>

  <!-- Handlers -->
  <rect x="350" y="120" width="280" height="140" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="366" y="146">Temporal, automatically</text>
  <text class="t b" x="366" y="170">Replay on another Worker</text>
  <text class="t b" x="366" y="190">Timeouts detect lost attempts</text>
  <text class="t b" x="366" y="210">Activity Retry Policy (default: on)</text>
  <text class="t s" x="366" y="236">you only set timeouts and policies</text>

  <rect x="350" y="322" width="280" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t bb" x="366" y="346">Your code</text>
  <text class="m" x="366" y="368">NewNonRetryableApplicationError</text>
  <text class="t s" x="366" y="388">+ error checks in the Workflow</text>

  <rect x="350" y="418" width="280" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="366" y="442">You, by redeploying</text>
  <text class="t b" x="366" y="464">Workflow Task retried until fixed</text>
  <text class="t s" x="366" y="484">progress is kept</text>

  <line x1="300" y1="151" x2="346" y2="170" stroke="#059669" stroke-width="1.5" marker-end="url(#arrg)"/>
  <line x1="300" y1="266" x2="346" y2="214" stroke="#059669" stroke-width="1.5" marker-end="url(#arrg)"/>
  <line x1="300" y1="362" x2="346" y2="362" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrr)"/>
  <line x1="300" y1="458" x2="346" y2="458" stroke="#d97706" stroke-width="1.5" marker-end="url(#arro)"/>

  <!-- Outcomes -->
  <rect x="680" y="150" width="260" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="696" y="174">Workflow continues</text>
  <text class="t b" x="696" y="196">forward recovery</text>
  <text class="t s" x="696" y="216">as if nothing happened</text>

  <rect x="680" y="322" width="260" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t bb" x="696" y="346">Compensate, or fail</text>
  <text class="t b" x="696" y="368">backward recovery</text>
  <text class="t s" x="696" y="388">release stock, refund, notify</text>

  <rect x="680" y="418" width="260" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="696" y="442">Workflow blocked, still Running</text>
  <text class="t b" x="696" y="464">resumes after the fix</text>
  <text class="t s" x="696" y="484">watch WorkflowTaskFailed</text>

  <line x1="630" y1="190" x2="676" y2="190" stroke="#059669" stroke-width="1.5" marker-end="url(#arrg)"/>
  <line x1="630" y1="362" x2="676" y2="362" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrr)"/>
  <line x1="630" y1="458" x2="676" y2="458" stroke="#d97706" stroke-width="1.5" marker-end="url(#arro)"/>
  <path d="M 490 260 L 490 318" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text class="t s" x="500" y="294">retries exhausted</text>
  <text class="t s" x="30" y="528">Dashed: a transient error that never clears ends up in your Workflow code like a permanent one.</text>
</svg>
