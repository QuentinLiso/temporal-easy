<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Task failure vs Workflow Execution failure in Go</title>
  <desc id="desc">In Go, a Workflow function that returns any error, errors.New included, fails the Workflow Execution: the Workflow is closed as Failed and only a Workflow Retry Policy starts a new run. A panic, non-determinism, code that blocks for more than one second, or a blocking SDK call during panic unwinding fails the Workflow Task instead: the Workflow stays Running and the Task is retried with backoff. After five consecutive failures the TemporalReportedProblems search attribute is set. Deploying a fix lets the next attempt succeed and the Workflow continues. With the FailWorkflow panic policy, panics fail the Execution instead.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">In Go: returning an error ends the Workflow, panicking blocks it</text>

  <!-- Workflow code -->
  <rect x="20" y="200" width="200" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t bb" x="36" y="228">Your Workflow function</text>
  <text class="m" x="36" y="252">func ShipOrderWorkflow(</text>
  <text class="m" x="36" y="270">  ctx, in) (…, error)</text>

  <!-- Returns error path -->
  <rect x="290" y="70" width="290" height="104" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t bb" x="306" y="96">returns an error</text>
  <text class="m" x="306" y="118">return errors.New("…")</text>
  <text class="m" x="306" y="136">return NewApplicationError(…)</text>
  <text class="m" x="306" y="154">return activityErr</text>
  <line x1="220" y1="230" x2="286" y2="140" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrr)"/>

  <rect x="640" y="70" width="300" height="104" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="t bb" x="656" y="96">Workflow Execution failure</text>
  <text class="t b" x="656" y="118">status Failed (or Canceled), closed</text>
  <text class="t b" x="656" y="138">no retry, unless a Workflow</text>
  <text class="t b" x="656" y="156">Retry Policy starts a new run</text>
  <line x1="580" y1="122" x2="636" y2="122" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrr)"/>

  <!-- Panic path -->
  <rect x="290" y="300" width="290" height="124" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="306" y="326">panics or misbehaves</text>
  <text class="t b" x="306" y="348">panic (nil map, index out of range)</text>
  <text class="t b" x="306" y="368">non-determinism after a change</text>
  <text class="t b" x="306" y="388">blocks > 1 s (TMPRL1101 deadlock)</text>
  <text class="t b" x="306" y="408">blocking SDK call during panic unwinding</text>
  <line x1="220" y1="270" x2="286" y2="356" stroke="#d97706" stroke-width="1.5" marker-end="url(#arro)"/>

  <rect x="640" y="300" width="300" height="124" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="656" y="326">Workflow Task failure</text>
  <text class="t b" x="656" y="348">status stays Running, progress kept</text>
  <text class="t b" x="656" y="368">Task retried with backoff</text>
  <text class="t b" x="656" y="388">after 5 failures:</text>
  <text class="m" x="656" y="408">TemporalReportedProblems</text>
  <line x1="580" y1="362" x2="636" y2="362" stroke="#d97706" stroke-width="1.5" marker-end="url(#arro)"/>

  <!-- Fix -->
  <rect x="640" y="446" width="300" height="56" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="656" y="470">Deploy a fix</text>
  <text class="t b" x="656" y="490">next attempt succeeds, Workflow continues</text>
  <line x1="790" y1="424" x2="790" y2="442" stroke="#059669" stroke-width="1.5" marker-end="url(#arrg)"/>

  <!-- FailWorkflow policy -->
  <path d="M 592 300 L 700 180" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text class="t s" x="712" y="232">WorkflowPanicPolicy: worker.FailWorkflow</text>
  <text class="t s" x="712" y="248">(default BlockWorkflow keeps it Running)</text>
</svg>
