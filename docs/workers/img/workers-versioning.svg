<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Worker Versioning</title>
  <desc id="desc">A Worker Deployment named shop-fulfillment has three Worker Deployment Versions identified by Build IDs. Version 2026.10.18 is Draining: it still runs pinned Workflows that started on it. Version 2026.10.25 is Current and receives new Workflows and Auto-Upgrade Workflows. Version 2026.11.02 is Ramping at 10 percent. The Temporal Service routes each Workflow Task by the Workflow's versioning behavior: Pinned Workflows stay on their Version, Auto-Upgrade Workflows go to their Target Version (Current or Ramping, chosen from the Workflow ID), and new Workflows go to the Target Version too.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827;white-space:pre}
      .n{font-size:12px;font-weight:700;fill:#ffffff}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">One Deployment, several Versions, routing by behavior</text>

  <!-- workflows on the left -->
  <text class="t bb" x="30" y="80">Workflow Tasks</text>
  <rect x="20" y="96" width="250" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t bb" x="34" y="120">Pinned, started on 10.18</text>
  <text class="m" x="34" y="142">OrderFulfillmentWorkflow</text>

  <rect x="20" y="196" width="250" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="34" y="220">Auto-Upgrade</text>
  <text class="m" x="34" y="242">LoyaltyAccountWorkflow</text>

  <rect x="20" y="296" width="250" height="64" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="34" y="320">New Workflow</text>
  <text class="t s" x="34" y="342">any type, just started</text>

  <!-- service router -->
  <rect x="320" y="96" width="200" height="264" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t bb" x="336" y="122">Temporal Service</text>
  <text class="t s" x="336" y="144">Task Queue "fulfillment"</text>
  <text class="t s" x="336" y="176">Pinned → its Version</text>
  <text class="t s" x="336" y="200">Auto-Upgrade → Target</text>
  <text class="t s" x="336" y="224">New → Target</text>
  <text class="t s" x="336" y="256">Target = Current, or</text>
  <text class="t s" x="336" y="274">Ramping for ramp % of</text>
  <text class="t s" x="336" y="292">Workflow IDs</text>

  <line x1="270" y1="128" x2="316" y2="128" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrp)"/>
  <line x1="270" y1="228" x2="316" y2="228" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <line x1="270" y1="328" x2="316" y2="328" stroke="#059669" stroke-width="1.5" marker-end="url(#arrg)"/>

  <!-- versions -->
  <text class="t bb" x="580" y="80">Worker Deployment "shop-fulfillment"</text>
  <rect x="580" y="96" width="350" height="72" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="596" y="120">Build 2026.10.18</text>
  <rect x="820" y="106" width="96" height="22" rx="5" fill="#d97706"/>
  <text class="t n" x="830" y="122">DRAINING</text>
  <text class="t s" x="596" y="146">only finishes its pinned Workflows</text>

  <rect x="580" y="188" width="350" height="72" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="596" y="212">Build 2026.10.25</text>
  <rect x="820" y="198" width="96" height="22" rx="5" fill="#059669"/>
  <text class="t n" x="832" y="214">CURRENT</text>
  <text class="t s" x="596" y="238">gets 90% of new and Auto-Upgrade work</text>

  <rect x="580" y="280" width="350" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="596" y="304">Build 2026.11.02</text>
  <rect x="808" y="290" width="108" height="22" rx="5" fill="#2563eb"/>
  <text class="t n" x="816" y="306">RAMPING 10%</text>
  <text class="t s" x="596" y="330">gets 10%, chosen by Workflow ID</text>

  <line x1="520" y1="132" x2="576" y2="132" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrp)"/>
  <line x1="520" y1="224" x2="576" y2="224" stroke="#059669" stroke-width="1.5" marker-end="url(#arrg)"/>
  <line x1="520" y1="240" x2="576" y2="310" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrb)"/>

  <!-- lifecycle strip -->
  <text class="t bb" x="30" y="412">Version lifecycle</text>
  <rect x="30" y="426" width="150" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t bb" x="46" y="448">Inactive</text>
  <rect x="250" y="426" width="190" height="34" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="266" y="448">Active (Current/Ramping)</text>
  <rect x="510" y="426" width="150" height="34" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="526" y="448">Draining</text>
  <rect x="730" y="426" width="150" height="34" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t bb" x="746" y="448">Drained</text>
  <line x1="180" y1="443" x2="246" y2="443" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="443" x2="506" y2="443" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="443" x2="726" y2="443" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="t s" x="30" y="490">first poll</text>
  <text class="t s" x="250" y="490">set-current / set-ramping</text>
  <text class="t s" x="510" y="490">replaced, pinned runs open</text>
  <text class="t s" x="730" y="490">all pinned runs closed</text>
</svg>
