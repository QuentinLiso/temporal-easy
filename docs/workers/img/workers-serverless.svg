<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Serverless Worker invocation flow</title>
  <desc id="desc">1: a Client or Workflow creates a Task. 2: the Matching Service tries a sync match with a polling Worker. 3: if a Worker is polling, the Task goes to it. 4: if not, Matching signals the Worker Controller Instance, a system Workflow running in your Namespace, one per Worker Deployment Version with a compute provider. The WCI triggers the compute provider (AWS Lambda, Cloud Run Worker Pool, AgentCore) using an IAM role or service account. 5: the Serverless Worker starts, dials Temporal and polls the Task Queue. 6: it processes Tasks, then stops when work drains or the invocation ends.</desc>
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2937}
      .h{font-size:16px;font-weight:700}
      .b{font-size:13px}
      .bb{font-size:13px;font-weight:700}
      .s{font-size:12px;fill:#4b5563}
      .m{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#111827;white-space:pre}
      .n{font-size:12px;font-weight:700;fill:#ffffff}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" rx="14" fill="#ffffff"/>
  <text class="t h" x="30" y="38">Temporal starts the Worker when Tasks wait</text>

  <!-- caller -->
  <rect x="20" y="80" width="170" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="t bb" x="34" y="106">Client / Workflow</text>
  <text class="m" x="34" y="130">StartWorkflow</text>
  <text class="m" x="34" y="144">ScheduleActivity</text>

  <!-- temporal service -->
  <rect x="240" y="60" width="380" height="250" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t bb" x="256" y="84">Temporal Service (your Namespace)</text>
  <rect x="260" y="100" width="170" height="62" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text class="t bb" x="274" y="124">Matching Service</text>
  <text class="t s" x="274" y="144">Task Queue "invoicing"</text>

  <rect x="260" y="210" width="340" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text class="t bb" x="274" y="234">Worker Controller Instance (system Workflow)</text>
  <text class="t s" x="274" y="254">one per Deployment Version with a compute provider</text>
  <text class="t s" x="274" y="272">watches sync-match failures + backlog, sizes the pool</text>

  <line x1="190" y1="122" x2="256" y2="128" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <circle cx="222" cy="108" r="10" fill="#2563eb"/><text class="t n" x="218" y="112">1</text>

  <line x1="345" y1="162" x2="345" y2="206" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrp)"/>
  <circle cx="330" cy="186" r="10" fill="#7c3aed"/><text class="t n" x="326" y="190">4</text>
  <text class="t s" x="360" y="190">no poller: sync match failed</text>

  <!-- existing worker path -->
  <rect x="680" y="70" width="250" height="60" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="694" y="96">Worker already polling</text>
  <text class="t s" x="694" y="116">gets the Task directly</text>
  <line x1="430" y1="118" x2="676" y2="100" stroke="#059669" stroke-width="1.5" marker-end="url(#arrg)"/>
  <circle cx="455" cy="140" r="10" fill="#059669"/><text class="t n" x="451" y="144">2</text>
  <text class="t s" x="471" y="144">try a sync match</text>
  <circle cx="650" cy="86" r="10" fill="#059669"/><text class="t n" x="646" y="90">3</text>

  <!-- compute provider -->
  <rect x="680" y="200" width="250" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="t bb" x="694" y="224">Compute provider</text>
  <text class="t s" x="694" y="244">AWS Lambda (invoke function)</text>
  <text class="t s" x="694" y="262">GCP Cloud Run (scale Worker Pool)</text>
  <text class="t s" x="694" y="280">AgentCore Runtime (session)</text>
  <text class="t s" x="694" y="298">via IAM role / service account</text>
  <line x1="600" y1="250" x2="676" y2="250" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text class="t s" x="608" y="240">trigger</text>

  <!-- serverless worker -->
  <rect x="440" y="370" width="490" height="90" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text class="t bb" x="456" y="396">Serverless Worker (your code, same SDK)</text>
  <text class="t s" x="456" y="418">starts → dials Temporal → polls "invoicing" → runs Tasks</text>
  <text class="t s" x="456" y="438">stops when work drains / before the invocation deadline</text>
  <line x1="805" y1="310" x2="805" y2="366" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="820" cy="340" r="10" fill="#059669"/><text class="t n" x="816" y="344">5</text>
  <path d="M 440 415 L 215 415 L 215 150 L 256 150" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
  <circle cx="215" cy="300" r="10" fill="#059669"/><text class="t n" x="211" y="304">6</text>
  <text class="t s" x="30" y="380">polls the Task Queue,</text>
  <text class="t s" x="30" y="396">completes Tasks</text>

  <text class="t s" x="30" y="488">Requires Worker Versioning: the compute provider is configured on a Worker Deployment Version.</text>
</svg>
